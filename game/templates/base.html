<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>{% block title %}Enterprise Anti-Phishing Training Platform{% endblock %}</title>
<style>
.container { width: 90%; margin: 30px auto; }
nav {
    background: #a1bf88;
    padding: 14px 24px;
    display: flex;
    justify-content: space-between;
    align-items: center;
}
.nav-left a, .nav-right a {
    color: #ffffff;
    margin: 0 14px;
    text-decoration: none;
    font-size:18px;
}
.nav-left a:first-child{
    margin-left:0;
}
.nav-right span{
    color:#fff;
    font-size:18px;
}
.nav-right a:last-child{
    margin-right:0;
}
.nav-left a:hover,.nav-right a:hover{
    text-decoration:underline;
}
.mail-card { border: 1px solid #ccc; padding: 16px; margin: 12px 0; border-radius: 6px; }
</style>
</head>
<body>
{% block top_nav %}
<nav>
    <!-- Fixed navigation on the left -->
    <div class="nav-left">
    {% if user.is_authenticated %}
        <a href="{% url 'home' %}">Home</a>
    {% else %}
        <a href="{% url 'home' %}">Home</a>
        <a href="{% url 'register' %}">Registration</a>
    {% endif %}
    </div>
    <!-- Right side: Registration, Login, User Information, Personal Center, Logout -->
    <div class="nav-right">
    {% if user.is_authenticated %}
        <span>Welcome, {{ user.username }} | Role: {{ user.get_role_display }}</span>
        <a href="{% url 'profile' %}">Personal Center</a>
        <a href="{% url 'logout' %}">Sign Out</a>
    {% else %}
        <a href="{% url 'login' %}">Log In</a>
    {% endif %}
    </div>
</nav>
{% endblock %}

<div class="container">
{% block content %}{% endblock %}
</div>
</body>
</html>

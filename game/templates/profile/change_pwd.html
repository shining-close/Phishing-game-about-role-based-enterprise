{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<h1>Change Login Password</h1>
{% if messages %}
    {% for msg in messages %}
        <p style="color:{% if msg.tags == 'error' %}red{% else %}green{% endif %};">{{ msg }}</p>
    {% endfor %}
{% endif %}
<form method="post" style="max-width:520px;margin-top:20px;">
    {% csrf_token %}
    <div style="margin:14px 0;">
        <label>Original Password</label><br>
        <input type="password" name="old_password" required style="width:100%;padding:9px;margin-top:6px;">
    </div>
    <div style="margin:14px 0;">
        <label>New Password</label><br>
        <input type="password" name="new_password" required style="width:100%;padding:9px;margin-top:6px;">
    </div>
    <div style="margin:14px 0;">
        <label>Confirm New Password</label><br>
        <input type="password" name="confirm_password" required style="width:100%;padding:9px;margin-top:6px;">
    </div>
    <button type="submit" style="padding:10px 24px;background:#165DFF;color:#fff;border:none;border-radius:6px;">Submit Modify</button>
</form>
<a href="{% url 'profile' %}" style="display:block;margin-top:16px;">← Back to Personal Center</a>
{% endblock %}

{% extends "base.html" %}
{% block title %}Apply to Switch Role{% endblock %}

{% block content %}
<h1>Submit Role Switch Application</h1>
{% if messages %}
    {% for msg in messages %}
        <p style="color:{% if msg.tags == 'error' %}red{% else %}green{% endif %};">{{ msg }}</p>
    {% endfor %}
{% endif %}
<form method="post" style="max-width:500px;margin-top:20px;">
    {% csrf_token %}
    <div style="margin:14px 0;">
        <label>Select Target Role You Want to Switch To</label><br>
        <select name="target_role" required style="width:100%;padding:9px;margin-top:6px;">
            {% for val, name in role_list %}
                {% if val != user.role %}
                    <option value="{{ val }}">{{ name }}</option>
                {% endif %}
            {% endfor %}
        </select>
    </div>
    <button type="submit" style="padding:10px 24px;background:#008844;color:#fff;border:none;border-radius:6px;">Submit Application</button>
</form>
<a href="{% url 'profile' %}" style="display:block;margin-top:16px;">← Back to Personal Center</a>
{% endblock %}
